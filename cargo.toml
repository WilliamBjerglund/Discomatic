[package]
name = "Discomatic"
version = "0.3.0"
edition = "2024"
description = "A Discord bot that does a lot of fun things!"

[dependencies]
poise = "0.6.2"
rand = "0.10.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
dotenvy = "0.15"
regex = "1.7.1"
colored = "3.1.1"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
linkify = "0.11.0"
url = "2.5.8"
serde_json = "1.0.150"
scraper = "0.27.0"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
songbird = { version = "0.6", features = [
    "serenity",
    "driver",
    "builtin-queue",
    "gateway",
    "rustls",
] }
symphonia = { version = "0.5", features = [
    "aac",
    "mp3",
    "isomp4",
    "alac",
    "flac",
    "vorbis",
    "pcm",
    "mkv",
    "wav",
    "ogg",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
